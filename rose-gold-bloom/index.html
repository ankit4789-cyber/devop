<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100608">
  <meta name="description" content="A cinematic rose in bloom — a little luxury, made with love.">
  <title>A Rose for Someone Special</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <main class="experience">
    <div class="topline"><span class="topline-rule"></span><span>A MOMENT, JUST FOR YOU</span><span class="topline-rule"></span></div>
    <section class="stage" aria-label="An animated three-dimensional red rose">
      <div class="halo"></div>
      <div id="scene" class="scene"></div>
      <div class="stage-caption">FOREVER IN BLOOM <span>✦</span></div>
    </section>
    <section class="message" aria-live="polite">
      <p class="eyebrow">A GIFT FROM THE HEART</p>
      <h1>A Rose for Someone Special</h1>
      <p class="dedication">Some flowers are beautiful, but some remind us<br class="desktop-break"> of someone special. <span class="heart">♥</span></p>
    </section>
    <div class="opening" id="opening">
      <button class="open-button" id="openButton"><span>TAP TO OPEN</span><span class="button-heart">♥</span></button>
      <p class="open-note">A little something, made just for you</p>
    </div>
    <button class="music-button" id="musicButton" aria-label="Turn music off" hidden>
      <span class="music-bars"><i></i><i></i><i></i><i></i></span><span id="musicLabel">MUSIC ON</span>
    </button>
    <footer>MADE WITH <span>♥</span> & A LITTLE MAGIC</footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
